<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}

/* ── THEME VARIABLES ── */
:root{
  /* Night mode (default) */
  --bg:#08121F;--bg2:#0D1B2E;--bg3:#142236;--bg4:#1B2A4A;
  --blue:#4A7BE8;--blue2:#2A5FCC;--blue-glow:rgba(74,123,232,.55);
  --green:#4CAF82;--red:#F87171;
  --text:#EDE8E0;--text2:#B8C5D6;--gray:#6A7A8E;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.12);
  --bubble-ai:rgba(255,255,255,.07);--bubble-ai-border:rgba(255,255,255,.09);
  --input-bg:rgba(255,255,255,.07);--input-border:rgba(255,255,255,.1);
  --hdr-bg:linear-gradient(180deg,#060D18 0%,#0D1B2E 100%);
  --logo-filter:brightness(1.05) drop-shadow(0 2px 8px rgba(74,123,232,.3));
  --bar-bg:rgba(6,13,24,.96);
  --mode-icon:☀️;
}
body.day{
  --bg:#F0F4FA;--bg2:#E8EEF8;--bg3:#DDE5F5;--bg4:#C8D6EF;
  --blue:#2A5FCC;--blue2:#1A4AB0;--blue-glow:rgba(42,95,204,.4);
  --green:#1A7A4A;--red:#D94040;
  --text:#0F1E35;--text2:#3A4A6A;--gray:#7A8596;
  --border:rgba(0,0,0,.08);--border2:rgba(0,0,0,.12);
  --bubble-ai:rgba(255,255,255,.85);--bubble-ai-border:rgba(0,0,0,.08);
  --input-bg:rgba(255,255,255,.9);--input-border:rgba(0,0,0,.12);
  --hdr-bg:linear-gradient(180deg,#FFFFFF 0%,#EEF3FC 100%);
  --logo-filter:brightness(1) drop-shadow(0 2px 6px rgba(42,95,204,.2));
  --bar-bg:rgba(240,244,250,.97);
  --mode-icon:🌙;
}

html,body{height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;transition:background .35s,color .35s}

/* ── APP SHELL ── */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;transition:background .35s}

/* ── HEADER ── */
#hdr{
  background:var(--hdr-bg);
  padding:calc(env(safe-area-inset-top,16px) + 10px) 18px 14px;
  display:flex;align-items:center;gap:0;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  box-shadow:0 2px 16px rgba(0,0,0,.12);
}
#logo-wrap{
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);
  border-radius:12px;
  padding:7px 10px;
  margin-right:12px;
  border:1px solid var(--border2);
  box-shadow:0 2px 8px rgba(0,0,0,.15);
  flex-shrink:0;
}
#hdr-logo{
  height:32px;width:auto;
  filter:var(--logo-filter);
  display:block;
}
#hdr-info{flex:1;min-width:0}
#hdr-info h2{font-size:16px;font-weight:800;color:var(--text);letter-spacing:-.3px;white-space:nowrap}
#hdr-info p{font-size:9px;color:var(--blue);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px;font-weight:600}
#hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
#hdr-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px rgba(76,175,130,.7)}
#mode-btn{
  background:var(--bg3);border:1px solid var(--border2);border-radius:20px;
  padding:5px 10px;font-size:13px;cursor:pointer;
  transition:all .2s;flex-shrink:0;line-height:1;
}
#cp-btn{
  background:var(--blue);border:none;border-radius:20px;
  padding:6px 12px;color:#fff;font-size:10px;font-weight:700;
  cursor:pointer;font-family:inherit;letter-spacing:.3px;
  box-shadow:0 2px 10px var(--blue-glow);
}

/* ── SPHERE ZONE ── */
#sphere-zone{
  display:flex;flex-direction:column;align-items:center;
  padding:16px 0 8px;flex-shrink:0;
}
#sw{position:relative;width:90px;height:90px}
#sv{width:90px;height:90px;transition:filter .35s}
#sr{position:absolute;inset:-9px;border-radius:50%;border:2.5px solid transparent;pointer-events:none;transition:all .35s}
#sl{font-size:9px;color:var(--gray);letter-spacing:1.8px;text-transform:uppercase;margin-top:6px;font-weight:600}

/* ── CHAT ── */
#chat{
  flex:1;overflow-y:auto;padding:12px 14px;
  display:flex;flex-direction:column;gap:8px;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:var(--bg);transition:background .35s;
}
#chat::-webkit-scrollbar{display:none}
.b{padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.65;max-width:85%;word-wrap:break-word;animation:popin .2s ease}
.b.u{align-self:flex-end;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border-bottom-right-radius:4px;box-shadow:0 2px 10px var(--blue-glow)}
.b.a{align-self:flex-start;background:var(--bubble-ai);color:var(--text);border:1px solid var(--bubble-ai-border);border-bottom-left-radius:4px}
.b.s{align-self:center;font-size:11px;color:var(--gray);background:transparent;padding:4px 10px;text-align:center}
.td{width:6px;height:6px;border-radius:50%;background:var(--blue);display:inline-block;animation:tdot .9s infinite}
.td:nth-child(2){animation-delay:.15s}.td:nth-child(3){animation-delay:.3s}

/* ── INPUT BAR ── */
#bar{
  background:var(--bar-bg);border-top:1px solid var(--border);
  padding:10px 13px calc(10px + env(safe-area-inset-bottom,0px));
  display:flex;gap:8px;align-items:flex-end;flex-shrink:0;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  transition:background .35s,border-color .35s;
}
#inp{
  flex:1;background:var(--input-bg);border:1.5px solid var(--input-border);
  border-radius:20px;padding:9px 15px;font-size:14px;color:var(--text);
  outline:none;font-family:inherit;resize:none;min-height:40px;max-height:88px;
  line-height:1.5;transition:border .2s,background .35s;
  -webkit-text-fill-color:var(--text);
}
#inp:focus{border-color:var(--blue)}
#inp::placeholder{color:var(--gray)}
.ibtn{width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;transition:all .18s}
#mic-btn{background:var(--bg3);border:1.5px solid var(--border2)!important;color:var(--gray)}
#mic-btn.on{background:linear-gradient(135deg,var(--green),#228855);color:#fff;animation:mpulse 1s ease-in-out infinite}
#snd-btn{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 3px 12px var(--blue-glow)}
#snd-btn:active{transform:scale(.9)}

/* ── CARPLAY OVERLAY ── */
#cp{
  display:none;position:fixed;inset:0;z-index:800;
  flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,28px) + 20px) 24px calc(env(safe-area-inset-bottom,24px) + 20px);
  transition:background .35s;
}
body:not(.day) #cp{background:radial-gradient(ellipse at 50% 25%,#0D1E38 0%,#04090F 100%)}
body.day #cp{background:radial-gradient(ellipse at 50% 25%,#E8F0FB 0%,#C8D6EF 100%)}
#cp-sw{position:relative;width:170px;height:170px}
#cp-sv{width:170px;height:170px;transition:filter .4s}
#cp-sr{position:absolute;inset:-14px;border-radius:50%;border:3px solid transparent;pointer-events:none;transition:all .35s}
#cp-body{flex:1;display:flex;align-items:center;justify-content:center;padding:18px;width:100%}
#cp-p{font-size:clamp(18px,4.5vw,30px);font-weight:600;color:var(--text);line-height:1.4;text-align:center;max-width:680px}
#cp-p.usr{color:var(--gray);font-weight:400;font-size:clamp(14px,3.5vw,22px)}
#cp-sts{font-size:10px;color:var(--gray);letter-spacing:2.5px;text-transform:uppercase;font-weight:600}
#cp-btns{display:flex;gap:18px;align-items:center}
#cp-mic{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--green),#228855);border:none;font-size:30px;cursor:pointer;box-shadow:0 8px 28px rgba(76,175,130,.4);display:flex;align-items:center;justify-content:center;transition:all .2s}
#cp-mic.on{background:linear-gradient(135deg,var(--red),#B02828);box-shadow:0 8px 28px rgba(248,113,113,.4);animation:mpulse2 1s ease-in-out infinite}
#cp-x{width:50px;height:50px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);color:var(--gray);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#cp-mode{width:44px;height:44px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ── INSTALL BANNER ── */
#install-banner{
  position:fixed;bottom:0;left:0;right:0;z-index:9999;
  background:linear-gradient(0deg,var(--bg2),var(--bg3));
  border-top:1px solid rgba(74,123,232,.35);
  padding:13px 16px calc(13px + env(safe-area-inset-bottom,0px));
  display:none;align-items:center;gap:11px;
}
#install-banner.show{display:flex}
#ib-sphere{width:38px;height:38px;flex-shrink:0}
#ib-text{flex:1}
#ib-text strong{display:block;font-size:13px;color:var(--text);font-weight:700}
#ib-text span{font-size:11px;color:var(--gray);line-height:1.4}
#ib-x{color:var(--gray);font-size:18px;cursor:pointer;background:none;border:none;padding:4px;flex-shrink:0}

/* ── ANIMATIONS ── */
@keyframes popin{from{opacity:0;transform:scale(.91) translateY(4px)}to{opacity:1;transform:none}}
@keyframes tdot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

  var c=document.getElementById("chat");
  var d=document.createElement("div"); d.className="b "+r;
  d.innerHTML=(""+t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\n/g,"<br>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g,"<em>$1</em>");
  c.appendChild(d);
  setTimeout(function(){c.scrollTop=c.scrollHeight;},30);
}
function showDots(){var c=document.getElementById("chat");var d=document.createElement("div");d.className="b a";d.id="td";d.innerHTML="<span class='td'></span><span class='td'></span><span class='td'></span>";c.appendChild(d);c.scrollTop=c.scrollHeight;}
function hideDots(){var e=document.getElementById("td");if(e)e.remove();}

// ── API ───────────────────────────────────
function ask(text,isCP) {
  MSGS.push({role:"user",content:text});
  if(!isCP){bubble("u",text);showDots();}
  setState("think");
  var sys=isCP?SYS+" CARPLAY MODE: answer in 2 short sentences max.":SYS;
  fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":KEY,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:MODEL,max_tokens:isCP?280:1200,system:sys,messages:MSGS.slice(-16)})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    hideDots();
    var rep=(d.content||[]).map(function(x){return x.text||"";}).join("")||"Sorry, I could not get a response.";
    MSGS.push({role:"assistant",content:rep});
    if(!isCP)bubble("a",rep);
    if(isCP)cpTxt(rep,false);
    setState("speak");speak(rep);
  })
  .catch(function(){
    hideDots();setState("idle");
    var err="Connection error — check internet.";
    if(!isCP)bubble("s",err);else cpTxt(err,false);
  });
}
function doSend(){
  var el=document.getElementById("inp");if(!el||!el.value.trim())return;
  var t=el.value.trim();el.value="";el.style.height="auto";ask(t,false);
}

// ── SPEECH ────────────────────────────────
function speak(txt){
  if(!synth)return;synth.cancel();
  var clean=txt.replace(/<[^>]+>/g,"").replace(/\*\*/g,"").replace(/\*/g,"");
  var u=new SpeechSynthesisUtterance(clean);
  u.rate=1.05;u.pitch=1.0;
  var vs=synth.getVoices();
  var v=vs.find(function(x){return x.name==="Samantha"||x.name==="Karen"||x.name==="Daniel"||x.name==="Alex";});
  if(v)u.voice=v;
  u.onend=function(){setState("idle");};u.onerror=function(){setState("idle");};
  synth.speak(u);
}

// ── MIC ───────────────────────────────────
function mkRecog(onFinal,onEnd){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){bubble("s","Voice needs Safari on iPhone");return null;}
  var r=new SR();r.continuous=false;r.interimResults=true;r.lang="en-US";
  r.onresult=function(e){var t="";for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;if(e.results[e.results.length-1].isFinal)onFinal(t);};
  r.onerror=function(){setState("idle");onEnd&&onEnd();};
  r.onend=function(){onEnd&&onEnd();};
  return r;
}
function toggleMic(){
  var btn=document.getElementById("mic-btn");
  if(btn.classList.contains("on")){if(recog)recog.stop();btn.classList.remove("on");setState("idle");return;}
  if(synth)synth.cancel();
  recog=mkRecog(function(t){btn.classList.remove("on");document.getElementById("inp").value=t;ask(t,false);},function(){btn.classList.remove("on");});
  if(recog){recog.start();btn.classList.add("on");setState("listen");}
}

// ── CARPLAY ───────────────────────────────
function toggleCP(){
  inCP=!inCP;
  document.getElementById("cp").style.display=inCP?"flex":"none";
  document.getElementById("app").style.display=inCP?"none":"flex";
  if(!inCP&&cpRecog){try{cpRecog.stop();}catch(e){}}
  var cm=document.getElementById("cp-mic");if(cm)cm.classList.remove("on");
  setState("idle");
  if(inCP)cpTxt("Tap the mic and ask anything",false);
}
function cpTxt(t,isU){
  var el=document.getElementById("cp-p");if(!el)return;
  el.className=isU?"usr":"";
  el.textContent=(""+t).replace(/<[^>]+>/g,"").replace(/\*\*/g,"").replace(/\*/g,"");
}
function toggleCPMic(){
  var btn=document.getElementById("cp-mic");
  if(btn.classList.contains("on")){if(cpRecog)cpRecog.stop();btn.classList.remove("on");setState("idle");return;}
  if(synth)synth.cancel();
  cpRecog=mkRecog(function(t){btn.classList.remove("on");setState("think");cpTxt(t,true);ask(t,true);},function(){btn.classList.remove("on");});
  if(cpRecog){cpRecog.start();btn.classList.add("on");setState("listen");cpTxt("Listening...",false);}
}

// ── INSTALL BANNER ────────────────────────
function dismissBanner(){
  var b=document.getElementById("install-banner");if(b)b.classList.remove("show");
  try{localStorage.setItem("ra_banner","1");}catch(e){}
}
function checkBanner(){
  var standalone=window.navigator.standalone===true||window.matchMedia("(display-mode: standalone)").matches;
  var dismissed=false;try{dismissed=localStorage.getItem("ra_banner")==="1";}catch(e){}
  if(!standalone&&!dismissed){var b=document.getElementById("install-banner");if(b)b.classList.add("show");}
}

// ── INIT ──────────────────────────────────
loadMode();
setState("idle");
setTimeout(function(){if(synth)synth.getVoices();},500);
checkBanner();
var h=new Date().getHours();
var g=h<12?"Good morning":h<17?"Good afternoon":"Good evening";
bubble("a",g+"! I'm your Revive Assistant, built on Claude by Anthropic. Ask me anything about loans, guidelines, or calculations. Tap &#127911; for CarPlay voice mode.");
</script>
