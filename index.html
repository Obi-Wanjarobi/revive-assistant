<style>
/* =============================================
   RESET
   ============================================= */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}

/* =============================================
   NIGHT MODE (default — white on navy)
   ============================================= */
html,body{height:100%;overflow:hidden;font-family:-apple-system,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}

body{background:#050C18;color:#FFFFFF}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh;background:#050C18}

#hdr{padding:calc(env(safe-area-inset-top,18px) + 12px) 20px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:#050C18}
#logo-badge{background:#FFFFFF;border-radius:9px;padding:5px 9px;box-shadow:0 2px 12px rgba(74,123,232,.3);flex-shrink:0}
#hdr-logo{height:26px;width:auto;display:block}
#hdr-left{display:flex;align-items:center;gap:10px}
#hdr-name{font-size:18px;font-weight:900;letter-spacing:-.5px;color:#FFFFFF}
#hdr-right{display:flex;align-items:center;gap:10px}
#online-dot{width:7px;height:7px;border-radius:50%;background:#4CAF82;box-shadow:0 0 8px rgba(76,175,130,.8);animation:dpulse 2.2s ease-in-out infinite;flex-shrink:0}
#mode-btn{background:none;border:none;font-size:16px;cursor:pointer;padding:4px;color:#FFFFFF;opacity:.8}
#cp-btn{background:rgba(74,123,232,.15);border:1px solid rgba(74,123,232,.3);border-radius:20px;padding:5px 13px;color:#90C8FF;font-size:10px;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:.5px}

#sphere-zone{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px;flex-shrink:0;position:relative}
#sphere-zone::before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(74,123,232,.16) 0%,transparent 70%);animation:amb 3s ease-in-out infinite;top:2px;pointer-events:none}
#sw{position:relative;width:86px;height:86px}
#sv{width:86px;height:86px;animation:s-idle 3s ease-in-out infinite}
#sr{position:absolute;inset:-9px;border-radius:50%;border:2px solid transparent;pointer-events:none;transition:all .35s}
#sl{font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-top:6px;font-weight:600;color:#90C8FF}

#chat{flex:1;overflow-y:auto;padding:10px 16px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#050C18}
#chat::-webkit-scrollbar{display:none}
.b{padding:11px 14px;border-radius:18px;font-size:14px;line-height:1.65;max-width:84%;word-wrap:break-word;animation:popin .2s ease}
.b.u{align-self:flex-end;background:linear-gradient(135deg,#4A7BE8,#2A5FCC);color:#FFFFFF;border-bottom-right-radius:4px}
.b.a{align-self:flex-start;background:rgba(255,255,255,.07);color:#FFFFFF;border:1px solid rgba(255,255,255,.1);border-bottom-left-radius:4px}
.b.s{align-self:center;font-size:11px;color:#5A6A7A;padding:4px 10px}
.td{width:5px;height:5px;border-radius:50%;background:#90C8FF;display:inline-block;animation:tdot .9s infinite}
.td:nth-child(2){animation-delay:.15s}.td:nth-child(3){animation-delay:.3s}

#bar{background:rgba(3,7,18,.97);border-top:1px solid rgba(255,255,255,.06);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;flex-shrink:0;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px)}
#inp{flex:1;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);border-radius:22px;padding:10px 15px;font-size:14px;color:#FFFFFF;-webkit-text-fill-color:#FFFFFF;outline:none;font-family:inherit;resize:none;min-height:42px;max-height:90px;line-height:1.5;transition:border .2s}
#inp::placeholder{color:rgba(255,255,255,.25)}
#inp:focus{border-color:#4A7BE8}
#mic-btn{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);border-radius:50%;width:42px;height:42px;color:rgba(255,255,255,.6);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s;flex-shrink:0}
#mic-btn.on{background:linear-gradient(135deg,#4CAF82,#228855);color:#FFFFFF;animation:mpulse 1s ease-in-out infinite;border-color:transparent}
#snd-btn{background:linear-gradient(135deg,#4A7BE8,#2A5FCC);border:none;border-radius:50%;width:42px;height:42px;color:#FFFFFF;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 14px rgba(74,123,232,.45);flex-shrink:0}

#cp{display:none;position:fixed;inset:0;z-index:900;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,28px) + 20px) 24px calc(env(safe-area-inset-bottom,24px) + 20px);background:radial-gradient(ellipse at 50% 20%,#0D1E38 0%,#02060E 100%)}
#cp-sz{position:relative;display:flex;align-items:center;justify-content:center}
#cp-sz::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(74,123,232,.18) 0%,transparent 70%);animation:amb 3s ease-in-out infinite}
#cp-sw{position:relative;width:168px;height:168px;z-index:1}
#cp-sv{width:168px;height:168px;animation:s-idle 3s ease-in-out infinite;transition:filter .4s}
#cp-sr{position:absolute;inset:-13px;border-radius:50%;border:3px solid transparent;pointer-events:none;transition:all .35s}
#cp-body{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;width:100%}
#cp-p{font-size:clamp(17px,4.5vw,29px);font-weight:600;color:#FFFFFF;line-height:1.4;text-align:center;max-width:660px}
#cp-p.usr{color:#5A6A7A;font-weight:400;font-size:clamp(13px,3.5vw,21px)}
#cp-sts{font-size:9px;color:#90C8FF;letter-spacing:2.5px;text-transform:uppercase;font-weight:700}
#cp-btns{display:flex;gap:16px;align-items:center}
#cp-mic{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#4A7BE8,#2A5FCC);border:none;font-size:28px;cursor:pointer;color:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(74,123,232,.45)}
#cp-mic.on{background:linear-gradient(135deg,#F87171,#B02828);animation:mpulse2 1s ease-in-out infinite}
#cp-x{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#cp-md{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#FFFFFF;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* =============================================
   DAY MODE (navy on white — every rule explicit)
   ============================================= */
body.day{background:#FFFFFF;color:#1B2A4A}
body.day #app{background:#FFFFFF}
body.day #hdr{background:#FFFFFF}
body.day #hdr-name{color:#1B2A4A}
body.day #mode-btn{color:#1B2A4A}
body.day #cp-btn{background:rgba(27,42,74,.08);border:1px solid rgba(27,42,74,.25);color:#1B2A4A}
body.day #online-dot{background:#1A7A4A;box-shadow:0 0 8px rgba(26,122,74,.7)}
body.day #sphere-zone::before{background:radial-gradient(circle,rgba(27,42,74,.08) 0%,transparent 70%)}
body.day #sl{color:#1B2A4A}
body.day #chat{background:#FFFFFF}
body.day .b.a{background:rgba(27,42,74,.06);color:#1B2A4A;border:1px solid rgba(27,42,74,.14)}
body.day .b.u{background:linear-gradient(135deg,#1B2A4A,#0F1E35);color:#FFFFFF}
body.day .b.s{color:#6A7A8E}
body.day .td{background:#1B2A4A}
body.day #bar{background:rgba(255,255,255,.98);border-top:1px solid rgba(27,42,74,.1)}
body.day #inp{background:rgba(27,42,74,.05);border:1.5px solid rgba(27,42,74,.18);color:#1B2A4A;-webkit-text-fill-color:#1B2A4A}
body.day #inp::placeholder{color:rgba(27,42,74,.32)}
body.day #inp:focus{border-color:#1B2A4A}
body.day #mic-btn{background:rgba(27,42,74,.07);border:1.5px solid rgba(27,42,74,.18);color:#1B2A4A}
body.day #snd-btn{background:linear-gradient(135deg,#1B2A4A,#0F1E35);box-shadow:0 3px 14px rgba(27,42,74,.3)}
body.day #cp{background:radial-gradient(ellipse at 50% 20%,#E8EEF8 0%,#C8D6EE 100%)}
body.day #cp-p{color:#1B2A4A}
body.day #cp-p.usr{color:#6A7A8E}
body.day #cp-sts{color:#1B2A4A}
body.day #cp-x{background:rgba(27,42,74,.08);border:1px solid rgba(27,42,74,.2);color:#4A5A6A}
body.day #cp-md{background:rgba(27,42,74,.08);border:1px solid rgba(27,42,74,.2);color:#1B2A4A}

/* =============================================
   ANIMATIONS
   ============================================= */
@keyframes dpulse{0%,100%{opacity:.7}50%{opacity:1;box-shadow:0 0 14px rgba(76,175,130,1)}}
@keyframes amb{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.2);opacity:1}}

ll="none" stroke="rgba(74,123,232,.15)" stroke-width=".8"></ellipse><ellipse cx="100" cy="100" rx="82" ry="90" fill="none" stroke="rgba(255,255,255,.1)" stroke-width=".8"></ellipse><ellipse cx="100" cy="62" rx="78" ry="20" fill="none" stroke="rgba(255,255,255,.14)" stroke-width=".8"></ellipse><ellipse cx="100" cy="100" rx="90" ry="22" fill="none" stroke="rgba(74,123,232,.14)" stroke-width=".8"></ellipse><ellipse cx="100" cy="138" rx="78" ry="20" fill="none" stroke="rgba(255,255,255,.14)" stroke-width=".8"></ellipse></g><circle cx="100" cy="100" r="90" fill="url(#se)"></circle><ellipse cx="68" cy="58" rx="29" ry="20" fill="url(#sh)" opacity=".95"></ellipse><ellipse cx="61" cy="52" rx="11" ry="8" fill="rgba(255,255,255,.6)" filter="url(#sf)"></ellipse><style>@keyframes pr{0%,100%{opacity:.22;transform:scale(1)}50%{opacity:.6;transform:scale(1.05)}}</style></svg></div><div id="sr" style="border-color: transparent; animation: 3s ease-in-out 0s infinite normal none running ridle;"></div></div>

  <div id="chat"><div class="b a">Good Morning! I am your LOA — how can I help you today?</div></div>

  <div id="bar">

<div id="cp">

    <div id="cp-sw"><div id="cp-sv" style="animation: 3s ease-in-out 0s infinite normal none running s-idle;"><svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;overflow:visible"><defs><radialgradient id="sg" cx="35%" cy="30%" r="72%"><stop offset="0%" stop-color="#FFF"></stop><stop offset="18%" stop-color="#C8DCF0"></stop><stop offset="42%" stop-color="#4A7BE8"></stop><stop offset="68%" stop-color="#1B2A4A"></stop><stop offset="100%" stop-color="#050C18"></stop></radialgradient><radialgradient id="sh" cx="32%" cy="26%" r="32%"><stop offset="0%" stop-color="rgba(255,255,255,.9)"></stop><stop offset="100%" stop-color="rgba(255,255,255,0)"></stop></radialgradient><radialgradient id="se" cx="50%" cy="50%" r="50%"><stop offset="62%" stop-color="rgba(27,42,74,0)"></stop><stop offset="100%" stop-color="rgba(5,12,24,.65)"></stop></radialgradient><filter id="sf"><fegaussianblur stdDeviation="2"></fegaussianblur></filter><clippath id="sc"><circle cx="100" cy="100" r="90"></circle></clippath></defs><circle cx="100" cy="100" r="94" fill="none" stroke="rgba(74,123,232,.22)" stroke-width="2" style="animation:pr 3s ease-in-out infinite;transform-origin:100px 100px"></circle><circle cx="100" cy="100" r="90" fill="url(#sg)"></circle><g clip-path="url(#sc)"><path d="M5,55Q55,15 100,45Q148,75 168,32" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.5" stroke-linecap="round"></path><path d="M2,85Q48,44 100,74Q152,104 184,62" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.2" stroke-linecap="round"></path><path d="M4,115Q46,78 100,104Q156,130 185,94" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="1" stroke-linecap="round"></path><path d="M6,146Q52,112 100,132Q150,155 182,124" fill="none" stroke="rgba(255,255,255,.18)" stroke-width=".9" stroke-linecap="round"></path><ellipse cx="100" cy="100" rx="20" ry="90" fill="none" stroke="rgba(255,255,255,.1)" stroke-width=".8"></ellipse><ellipse cx="100" cy="100" rx="55" ry="90" fill="none" stroke="rgba(74,123,232,.15)" stroke-width=".8"></ellipse><ellipse cx="100" cy="100" rx="82" ry="90" fill="none" stroke="rgba(255,255,255,.1)" stroke-width=".8"></ellipse><ellipse cx="100" cy="62" rx="78" ry="20" fill="none" stroke="rgba(255,255,255,.14)" stroke-width=".8"></ellipse><ellipse cx="100" cy="100" rx="90" ry="22" fill="none" stroke="rgba(74,123,232,.14)" stroke-width=".8"></ellipse><ellipse cx="100" cy="138" rx="78" ry="20" fill="none" stroke="rgba(255,255,255,.14)" stroke-width=".8"></ellipse></g><circle cx="100" cy="100" r="90" fill="url(#se)"></circle><ellipse cx="68" cy="58" rx="29" ry="20" fill="url(#sh)" opacity=".95"></ellipse><ellipse cx="61" cy="52" rx="11" ry="8" fill="rgba(255,255,255,.6)" filter="url(#sf)"></ellipse><style>@keyframes pr{0%,100%{opacity:.22;transform:scale(1)}50%{opacity:.6;transform:scale(1.05)}}</style></svg></div><div id="cp-sr" style="border-color: rgba(74, 123, 232, 0); animation: 3s ease-in-out 0s infinite normal none running ridle;"></div></div>

    <button id="cp-md" onclick="toggleMode()">☾</button>

</div>

<script>
var KEY="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",MODEL="claude-sonnet-4-5";
var SYS="You are LOA — Loan Originator Assistant for Revive Capital, Irvine CA. Built on Claude by Anthropic. Senior mortgage expert: Conventional, FHA, Non-QM, DSCR, Business Purpose. Think like an underwriter, speak like a trusted colleague. Be specific with numbers. In CarPlay: 2 sentences max.";
var MSGS=[],synth=window.speechSynthesis,recog=null,cpRecog=null,inCP=false,isDay=false;

// ── SPHERE ──────────────────────────────────
var ST={
  idle:  {a:"s-idle 3s ease-in-out infinite",   r:"transparent",           ra:"ridle 3s ease-in-out infinite",   l:"Ready",       ca:"s-idle 3s ease-in-out infinite",   cr:"rgba(74,123,232,0)",    s:"READY"},
  listen:{a:"s-listen .55s ease-in-out infinite",r:"rgba(248,113,113,.8)",  ra:"rpulse .55s ease-in-out infinite", l:"Listening...",ca:"s-listen .55s ease-in-out infinite",cr:"rgba(248,113,113,.8)", s:"LISTENING"},
  think: {a:"s-think .7s ease-in-out infinite",  r:"rgba(74,123,232,.8)",   ra:"rpulse .65s ease-in-out infinite", l:"Thinking...", ca:"s-think .7s ease-in-out infinite",  cr:"rgba(74,123,232,.8)",   s:"THINKING"},
  speak: {a:"s-speak .65s ease-in-out infinite", r:"rgba(76,175,130,.8)",   ra:"rpulse .6s ease-in-out infinite",  l:"Speaking...", ca:"s-speak .65s ease-in-out infinite", cr:"rgba(76,175,130,.8)",   s:"SPEAKING"}
};
function setState(s){
  var st=ST[s]||ST.idle;
  var sv=document.getElementById("sv");     if(sv)  sv.style.animation=st.a;
  var sr=document.getElementById("sr");     if(sr)  {sr.style.borderColor=st.r;sr.style.animation=st.ra;}
  var sl=document.getElementById("sl");     if(sl)  sl.textContent=st.l;
  var csv=document.getElementById("cp-sv"); if(csv) csv.style.animation=st.ca;
  var csr=document.getElementById("cp-sr"); if(csr) {csr.style.borderColor=st.cr;csr.style.animation=st.ra;}
  var cst=document.getElementById("cp-sts");if(cst) cst.textContent=st.s;
}

// ── CHAT ─────────────────────────────────────
function bubble(r,t){
  var c=document.getElementById("chat"),d=document.createElement("div");
  d.className="b "+r;
  d.innerHTML=(""+t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>");
  c.appendChild(d);
  setTimeout(function(){c.scrollTop=c.scrollHeight;},30);
}
function showDots(){
  var c=document.getElementById("chat"),d=document.createElement("div");
  d.className="b a";d.id="td";
  d.innerHTML="<span class='td'></span><span class='td'></span><span class='td'></span>";
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}
function hideDots(){var e=document.getElementById("td");if(e)e.remove();}

// ── API ──────────────────────────────────────
function ask(text,isCP){
  MSGS.push({role:"user",content:text});
  if(!isCP){bubble("u",text);showDots();}
  setState("think");
  var sys=isCP?SYS+" IMPORTANT: CarPlay mode, 2 short sentences only.":SYS;
  fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":KEY,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:MODEL,max_tokens:isCP?200:1200,system:sys,messages:MSGS.slice(-16)})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    hideDots();
    var rep=(d.content||[]).map(function(x){return x.text||"";}).join("")||"Sorry, I could not get a response.";
    MSGS.push({role:"assistant",content:rep});
    if(!isCP)bubble("a",rep);
    if(isCP)cpTxt(rep,false);
    setState("speak");speak(rep);
  })
  .catch(function(){
    hideDots();setState("idle");
    var e="Connection error. Check internet.";
    if(!isCP)bubble("s",e);else cpTxt(e,false);
  });
}
function doSend(){
  var el=document.getElementById("inp");
  if(!el||!el.value.trim())return;
  var t=el.value.trim();el.value="";el.style.height="auto";
  ask(t,false);
}

// ── SPEECH ───────────────────────────────────
function speak(txt){
  if(!synth)return;
  synth.cancel();
  var clean=txt.replace(/<[^>]+>/g,"").replace(/\*\*/g,"").replace(/\*/g,"");
  var u=new SpeechSynthesisUtterance(clean);
  u.rate=1.0;u.pitch=1.0;u.volume=1.0;
  // Load voices — iOS needs this
  var loadAndSpeak=function(){
    var vs=synth.getVoices();
    var v=vs.find(function(x){return x.name==="Samantha"||x.name==="Karen"||x.name==="Daniel"||x.name==="Alex";});
    if(v)u.voice=v;
    u.onend=function(){setState("idle");};
    u.onerror=function(){setState("idle");};
    synth.speak(u);
  };
  var vs=synth.getVoices();
  if(vs.length){loadAndSpeak();}
  else{synth.onvoiceschanged=function(){loadAndSpeak();synth.onvoiceschanged=null;};}
}

// ── MIC ──────────────────────────────────────
function mkRecog(onFinal,onEnd){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){bubble("s","Voice needs Safari on iPhone");return null;}
  var r=new SR();
  r.continuous=false;r.interimResults=true;r.lang="en-US";
  r.onresult=function(e){
    var t="";
    for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;
    if(e.results[e.results.length-1].isFinal)onFinal(t);
  };
  r.onerror=function(e){
    setState("idle");
    if(e.error==="not-allowed")bubble("s","Microphone blocked. Allow mic in iPhone Settings > Safari.");
    onEnd&&onEnd();
  };
  r.onend=function(){onEnd&&onEnd();};
  return r;
}
function toggleMic(){
  var btn=document.getElementById("mic-btn");
  if(btn.classList.contains("on")){
    if(recog)recog.stop();
    btn.classList.remove("on");setState("idle");return;
  }
  if(synth)synth.cancel();
  recog=mkRecog(
    function(t){btn.classList.remove("on");document.getElementById("inp").value=t;ask(t,false);},
    function(){btn.classList.remove("on");}
  );
  if(recog){recog.start();btn.classList.add("on");setState("listen");}
}

// ── CARPLAY ──────────────────────────────────
function toggleCP(){
  inCP=!inCP;
  document.getElementById("cp").style.display=inCP?"flex":"none";
  document.getElementById("app").style.display=inCP?"none":"flex";
  if(!inCP&&cpRecog){try{cpRecog.stop();}catch(e){}}
  var cm=document.getElementById("cp-mic");if(cm)cm.classList.remove("on");
  setState("idle");
  if(inCP)cpTxt("Tap the mic and ask anything",false);
}
function cpTxt(t,isU){
  var el=document.getElementById("cp-p");if(!el)return;
  el.className=isU?"usr":"";
  el.textContent=(""+t).replace(/<[^>]+>/g,"").replace(/\*\*/g,"").replace(/\*/g,"");
}
function toggleCPMic(){
  var btn=document.getElementById("cp-mic");
  if(btn.classList.contains("on")){
    if(cpRecog)cpRecog.stop();
    btn.classList.remove("on");setState("idle");return;
  }
  if(synth)synth.cancel();
  cpRecog=mkRecog(
    function(t){btn.classList.remove("on");setState("think");cpTxt(t,true);ask(t,true);},
    function(){btn.classList.remove("on");}
  );
  if(cpRecog){cpRecog.start();btn.classList.add("on");setState("listen");cpTxt("Listening...",false);}
}

// ── MODE ─────────────────────────────────────
function toggleMode(){
  isDay=!isDay;
  document.body.classList.toggle("day",isDay);
  var btns=document.querySelectorAll("#mode-btn,#cp-md");
  for(var i=0;i<btns.length;i++)btns[i].innerHTML=isDay?"&#9728;":"&#9790;";
  try{localStorage.setItem("loa_mode",isDay?"day":"night");}catch(e){}
}

// ── INIT ─────────────────────────────────────
window.addEventListener("load",function(){
  // Restore mode
  try{
    if(localStorage.getItem("loa_mode")==="day"){
      isDay=true;document.body.classList.add("day");
      var btns=document.querySelectorAll("#mode-btn,#cp-md");
      for(var i=0;i<btns.length;i++)btns[i].innerHTML="&#9728;";
    }
  }catch(e){}
  setState("idle");
  // Pre-load voices for iOS
  setTimeout(function(){if(synth)synth.getVoices();},400);
  // Greeting
  var h=new Date().getHours();
  var g=h<12?"Good Morning":h<17?"Good Afternoon":"Good Evening";
  bubble("a",g+"! I am your LOA — how can I help you today?");
});
</script>
