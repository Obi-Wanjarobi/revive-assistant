#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ── HEADER ── */
#hdr{
  background:linear-gradient(160deg,var(--hdr-from) 0%,var(--hdr-to) 100%);
  padding:calc(env(safe-area-inset-top,16px) + 10px) 16px 13px;
  display:flex;align-items:center;gap:0;
  border-bottom:1px solid var(--border2);
  flex-shrink:0;
  box-shadow:0 2px 20px rgba(0,0,0,.25);
}
/* Logo pill — white background for contrast */
#logo-pill{
  display:flex;align-items:center;justify-content:center;
  background:#FFFFFF;
  border-radius:11px;
  padding:7px 11px;
  margin-right:12px;
  border:1.5px solid rgba(74,123,232,.35);
  box-shadow:0 2px 14px rgba(74,123,232,.3), 0 1px 4px rgba(0,0,0,.2);
  flex-shrink:0;
}
#hdr-logo{height:34px;width:auto;display:block;}
#hdr-info{flex:1;min-width:0}
#hdr-info h2{font-size:16px;font-weight:800;color:var(--text);letter-spacing:-.3px;white-space:nowrap}
#hdr-info p{font-size:9px;color:var(--blue3);letter-spacing:1.8px;text-transform:uppercase;margin-top:2px;font-weight:600}
#hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
#hdr-dot{
  width:8px;height:8px;border-radius:50%;background:var(--green);
  box-shadow:0 0 8px rgba(76,175,130,.8);
  animation:dot-pulse 2.2s ease-in-out infinite;
}
@keyframes dot-pulse{0%,100%{box-shadow:0 0 5px rgba(76,175,130,.6)}50%{box-shadow:0 0 12px rgba(76,175,130,1),0 0 22px rgba(76,175,130,.4)}}
#mode-btn{
  background:rgba(74,123,232,.1);border:1px solid var(--border2);
  border-radius:20px;padding:5px 11px;font-size:14px;cursor:pointer;transition:all .2s;flex-shrink:0;line-height:1;
}
#cp-btn{
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  border:none;border-radius:20px;padding:6px 13px;color:#fff;
  font-size:10px;font-weight:800;cursor:pointer;font-family:inherit;
  letter-spacing:.5px;box-shadow:0 2px 12px var(--blue-glow);white-space:nowrap;
}

/* ── SPHERE ZONE ── */
#sphere-zone{
  display:flex;flex-direction:column;align-items:center;
  padding:16px 0 6px;flex-shrink:0;position:relative;
}
#sphere-zone::before{
  content:"";position:absolute;
  width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle,rgba(74,123,232,.18) 0%,transparent 70%);
  animation:ambient 3s ease-in-out infinite;top:8px;
}
@keyframes ambient{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.18);opacity:1}}
#sw{position:relative;width:92px;height:92px}
#sv{width:92px;height:92px;transition:filter .4s;animation:s-idle 3s ease-in-out infinite}
#sr{position:absolute;inset:-10px;border-radius:50%;border:2.5px solid transparent;pointer-events:none;transition:all .35s}
#sl{font-size:9px;color:var(--blue3);letter-spacing:2px;text-transform:uppercase;margin-top:7px;font-weight:700}
@keyframes s-idle  {0%,100%{filter:drop-shadow(0 6px 18px rgba(74,123,232,.6)) drop-shadow(0 0 10px rgba(144,200,255,.3))}50%{filter:drop-shadow(0 8px 30px rgba(74,123,232,.95)) drop-shadow(0 0 18px rgba(144,200,255,.55))}}
@keyframes s-listen{0%,100%{filter:drop-shadow(0 6px 22px rgba(248,113,113,.7))}50%{filter:drop-shadow(0 10px 38px rgba(248,113,113,1)) drop-shadow(0 0 22px rgba(248,113,113,.6))}}
@keyframes s-think {0%,100%{filter:drop-shadow(0 6px 22px rgba(74,123,232,.8))}50%{filter:drop-shadow(0 10px 38px rgba(74,123,232,1)) drop-shadow(0 0 22px rgba(144,200,255,.6))}}
@keyframes s-speak {0%,100%{filter:drop-shadow(0 6px 22px rgba(76,175,130,.7))}50%{filter:drop-shadow(0 10px 38px rgba(76,175,130,1)) drop-shadow(0 0 22px rgba(74,123,232,.5))}}

/* ── CHAT ── */
#chat{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:9px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#chat::-webkit-scrollbar{display:none}
.b{padding:11px 14px;border-radius:18px;font-size:14px;line-height:1.65;max-width:85%;word-wrap:break-word;animation:popin .22s ease}
.b.u{align-self:flex-end;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border-bottom-right-radius:4px;box-shadow:0 2px 12px var(--blue-glow)}
.b.a{align-self:flex-start;background:var(--bubble-ai);color:var(--text);border:1px solid var(--bubble-ai-border);border-bottom-left-radius:4px}
.b.s{align-self:center;font-size:11px;color:var(--gray);padding:4px 10px;text-align:center}
.td{width:6px;height:6px;border-radius:50%;background:var(--blue3);display:inline-block;animation:tdot .9s infinite}
.td:nth-child(2){animation-delay:.15s}.td:nth-child(3){animation-delay:.3s}

/* ── INPUT BAR ── */
#bar{
  background:var(--bar-bg);border-top:1px solid var(--border2);
  padding:10px 13px calc(10px + env(safe-area-inset-bottom,0px));
  display:flex;gap:8px;align-items:flex-end;flex-shrink:0;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
}
#inp{
  flex:1;background:var(--input-bg);border:1.5px solid var(--input-border);
  border-radius:20px;padding:10px 15px;font-size:14px;color:var(--text);
  outline:none;font-family:inherit;resize:none;min-height:42px;max-height:90px;
  line-height:1.5;-webkit-text-fill-color:var(--text);transition:border .2s;
}
#inp:focus{border-color:var(--blue)}
#inp::placeholder{color:var(--gray)}
.ibtn{width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;transition:all .18s}
#mic-btn{background:rgba(74,123,232,.1);border:1.5px solid var(--border2)!important;color:var(--blue3)}
#mic-btn.on{background:linear-gradient(135deg,var(--green),#228855);color:#fff;animation:mpulse 1s ease-in-out infinite}
#snd-btn{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 3px 14px var(--blue-glow)}
#snd-btn:active{transform:scale(.9)}

/* ── CARPLAY ── */
#cp{display:none;position:fixed;inset:0;z-index:800;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,28px) + 18px) 24px calc(env(safe-area-inset-bottom,24px) + 18px)}
body:not(.day) #cp{background:radial-gradient(ellipse at 50% 22%,#0D1E38 0%,#020810 100%)}
body.day #cp{background:radial-gradient(ellipse at 50% 22%,#E4EDF9 0%,#C0D4EE 100%)}
#cp-sz{position:relative;display:flex;align-items:center;justify-content:center}
#cp-sz::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(74,123,232,.2) 0%,transparent 70%);animation:ambient 3s ease-in-out infinite}
#cp-sw{position:relative;width:170px;height:170px;z-index:1}
#cp-sv{width:170px;height:170px;transition:filter .4s;animation:s-idle 3s ease-in-out infinite}
#cp-sr{position:absolute;inset:-14px;border-radius:50%;border:3px solid transparent;pointer-events:none;transition:all .35s}
#cp-body{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;width:100%}
#cp-p{font-size:clamp(18px,4.5vw,30px);font-weight:600;color:var(--text);line-height:1.4;text-align:center;max-width:680px}
#cp-p.usr{color:var(--gray);font-weight:400;font-size:clamp(14px,3.5vw,22px)}
#cp-sts{font-size:10px;color:var(--blue3);letter-spacing:2.5px;text-transform:uppercase;font-weight:700}
#cp-btns{display:flex;gap:18px;align-items:center}
#cp-mic{width:82px;height:82px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));border:none;font-size:30px;cursor:pointer;box-shadow:0 8px 28px var(--blue-glow);display:flex;align-items:center;justify-content:center;transition:all .2s;color:#fff}
#cp-mic.on{background:linear-gradient(135deg,var(--red),#B02828);box-shadow:0 8px 28px rgba(248,113,113,.4);animation:mpulse2 1s ease-in-out infinite}
#cp-x{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid var(--border2);color:var(--gray);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#cp-mode{width:46px;height:46px;border-radius:50%;background:rgba(74,123,232,.1);border:1px solid var(--border2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ── INSTALL BANNER ── */
#install-banner{position:fixed;bottom:0;left:0;right:0;z-index:9999;background:linear-gradient(0deg,var(--bg2),var(--bg3));border-top:1px solid var(--border2);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:none;align-items:center;gap:11px}
#install-banner.show{display:flex}
#ib-sphere{width:36px;height:36px;flex-shrink:0}
#ib-text{flex:1}
#ib-text strong{display:block;font-size:13px;color:var(--text);font-weight:700}
#ib-text span{font-size:11px;color:var(--gray);line-height:1.4}
#ib-x{color:var(--gray);font-size:18px;cursor:pointer;background:none;border:none;padding:4px;flex-shrink:0}

/* ── ANIMATIONS ── */
@keyframes popin{from{opacity:0;transform:scale(.91) translateY(4px)}to{opacity:1;transform:none}}
@keyframes tdot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
@keyframes mpulse{0%,100%{box-shadow:0 4px 16px rgba(76,175,130,.4)}50%{box-shadow:0 4px 30px rgba(76,175,130,.9),0 0 0 7px rgba(76,175,130,.14)}}
@keyframes mpulse2{0%,100%{box-shadow:0 8px 28px rgba(248,113,113,.4)}50%{box-shadow:0 8px 42px rgba(248,113,113,.9),0 0 0 10px rgba(248,113,113,.14)}}
@keyframes ridle{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.12);opacity:.75}}
@keyframes rpulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.22);opacity:1}}
</style>
</head>

<script>

<script>
var KEY="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",MODEL="claude-sonnet-4-5";
var SYS="You are the Revive Assistant, a senior mortgage AI for Revive Capital in Irvine CA. Built on Claude by Anthropic. Expert in Conventional, FHA, Non-QM, DSCR, Business Purpose loans. Think like an underwriter, talk like a trusted colleague. Be specific with numbers and examples. In CarPlay mode keep answers to 2-3 short sentences.";
var MSGS=[],synth=window.speechSynthesis,recog=null,cpRecog=null,inCP=false,isDay=false;

function toggleMode(){
  isDay=!isDay;document.body.classList.toggle("day",isDay);
  var ic=document.querySelectorAll("#mode-btn,#cp-mode");
  for(var i=0;i<ic.length;i++)ic[i].innerHTML=isDay?"&#9790;":"&#9728;";
  try{localStorage.setItem("ra_mode",isDay?"day":"night");}catch(e){}
}
function loadMode(){
  try{if(localStorage.getItem("ra_mode")==="day"){isDay=true;document.body.classList.add("day");var ic=document.querySelectorAll("#mode-btn,#cp-mode");for(var i=0;i<ic.length;i++)ic[i].innerHTML="&#9790;";}}catch(e){}
}

var ST={
  idle:  {sv:"s-idle 3s ease-in-out infinite",   sr:"transparent",          ring:"ridle 3s ease-in-out infinite",   lbl:"Ready",       csv:"s-idle 3s ease-in-out infinite",   csr:"rgba(74,123,232,0)",  cr:"ridle 3s ease-in-out infinite",  sts:"READY"},
  listen:{sv:"s-listen .55s ease-in-out infinite",sr:"rgba(248,113,113,.8)",ring:"rpulse .55s ease-in-out infinite",lbl:"Listening...",csv:"s-listen .55s ease-in-out infinite",csr:"rgba(248,113,113,.8)",cr:"rpulse .55s ease-in-out infinite",sts:"LISTENING"},
  think: {sv:"s-think .7s ease-in-out infinite",  sr:"rgba(74,123,232,.8)", ring:"rpulse .65s ease-in-out infinite",lbl:"Thinking...", csv:"s-think .7s ease-in-out infinite",  csr:"rgba(74,123,232,.8)", cr:"rpulse .65s ease-in-out infinite",sts:"THINKING"},
  speak: {sv:"s-speak .65s ease-in-out infinite", sr:"rgba(76,175,130,.8)", ring:"rpulse .6s ease-in-out infinite", lbl:"Speaking...", csv:"s-speak .65s ease-in-out infinite", csr:"rgba(76,175,130,.8)", cr:"rpulse .6s ease-in-out infinite", sts:"SPEAKING"}
};
function setState(s){
  var st=ST[s]||ST.idle;
  var sv=document.getElementById("sv");    if(sv)  sv.style.animation=st.sv;
  var sr=document.getElementById("sr");    if(sr)  {sr.style.borderColor=st.sr;sr.style.animation=st.ring;}
  var sl=document.getElementById("sl");    if(sl)  sl.textContent=st.lbl;
  var csv=document.getElementById("cp-sv");if(csv) csv.style.animation=st.csv;
  var csr=document.getElementById("cp-sr");if(csr) {csr.style.borderColor=st.csr;csr.style.animation=st.cr;}
  var cst=document.getElementById("cp-sts");if(cst) cst.textContent=st.sts;
}

function bubble(r,t){
  var c=document.getElementById("chat"),d=document.createElement("div");
  d.className="b "+r;
  d.innerHTML=(""+t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>");
  c.appendChild(d);setTimeout(function(){c.scrollTop=c.scrollHeight;},30);
}
function showDots(){var c=document.getElementById("chat"),d=document.createElement("div");d.className="b a";d.id="td";d.innerHTML="<span class='td'></span><span class='td'></span><span class='td'></span>";c.appendChild(d);c.scrollTop=c.scrollHeight;}
function hideDots(){var e=document.getElementById("td");if(e)e.remove();}

function ask(text,isCP){
  MSGS.push({role:"user",content:text});
  if(!isCP){bubble("u",text);showDots();}
  setState("think");
  var sys=isCP?SYS+" CARPLAY: 2 sentences max.":SYS;
  fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":KEY,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:MODEL,max_tokens:isCP?280:1200,system:sys,messages:MSGS.slice(-16)})})
  .then(function(r){return r.json();})
  .then(function(d){
    hideDots();
    var rep=(d.content||[]).map(function(x){return x.text||"";}).join("")||"Sorry, I could not get a response.";
    MSGS.push({role:"assistant",content:rep});
    if(!isCP)bubble("a",rep);if(isCP)cpTxt(rep,false);
    setState("speak");speak(rep);
  })
  .catch(function(){hideDots();setState("idle");var err="Connection error.";if(!isCP)bubble("s",err);else cpTxt(err,false);});
}
function doSend(){var el=document.getElementById("inp");if(!el||!el.value.trim())return;var t=el.value.trim();el.value="";el.style.height="auto";ask(t,false);}

function speak(txt){
  if(!synth)return;synth.cancel();
  var clean=txt.replace(/<[^>]+>/g,"").replace(/\*\*/g,"").replace(/\*/g,"");
  var u=new SpeechSynthesisUtterance(clean);u.rate=1.05;u.pitch=1.0;
  var vs=synth.getVoices(),v=vs.find(function(x){return x.name==="Samantha"||x.name==="Karen"||x.name==="Daniel"||x.name==="Alex";});
  if(v)u.voice=v;
  u.onend=function(){setState("idle");};u.onerror=function(){setState("idle");};
  synth.speak(u);
}

function mkRecog(onFinal,onEnd){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){bubble("s","Voice needs Safari on iPhone");return null;}
  var r=new SR();r.continuous=false;r.interimResults=true;r.lang="en-US";
  r.onresult=function(e){var t="";for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;if(e.results[e.results.length-1].isFinal)onFinal(t);};
  r.onerror=function(){setState("idle");onEnd&&onEnd();};r.onend=function(){onEnd&&onEnd();};return r;
}
function toggleMic(){
  var btn=document.getElementById("mic-btn");
  if(btn.classList.contains("on")){if(recog)recog.stop();btn.classList.remove("on");setState("idle");return;}
  if(synth)synth.cancel();
  recog=mkRecog(function(t){btn.classList.remove("on");document.getElementById("inp").value=t;ask(t,false);},function(){btn.classList.remove("on");});
  if(recog){recog.start();btn.classList.add("on");setState("listen");}
}
function toggleCP(){
  inCP=!inCP;
  document.getElementById("cp").style.display=inCP?"flex":"none";
  document.getElementById("app").style.display=inCP?"none":"flex";
  if(!inCP&&cpRecog){try{cpRecog.stop();}catch(e){}}
  var cm=document.getElementById("cp-mic");if(cm)cm.classList.remove("on");
  setState("idle");if(inCP)cpTxt("Tap the mic and ask anything",false);
}
function cpTxt(t,isU){var el=document.getElementById("cp-p");if(!el)return;el.className=isU?"usr":"";el.textContent=(""+t).replace(/<[^>]+>/g,"").replace(/\*\*/g,"").replace(/\*/g,"");}
function toggleCPMic(){
  var btn=document.getElementById("cp-mic");
  if(btn.classList.contains("on")){if(cpRecog)cpRecog.stop();btn.classList.remove("on");setState("idle");return;}
  if(synth)synth.cancel();
  cpRecog=mkRecog(function(t){btn.classList.remove("on");setState("think");cpTxt(t,true);ask(t,true);},function(){btn.classList.remove("on");});
  if(cpRecog){cpRecog.start();btn.classList.add("on");setState("listen");cpTxt("Listening...",false);}
}
function dismissBanner(){var b=document.getElementById("install-banner");if(b)b.classList.remove("show");try{localStorage.setItem("ra_banner","1");}catch(e){}}
function checkBanner(){
  var sa=window.navigator.standalone===true||window.matchMedia("(display-mode: standalone)").matches;
  var dm=false;try{dm=localStorage.getItem("ra_banner")==="1";}catch(e){}
  if(!sa&&!dm){var b=document.getElementById("install-banner");if(b)b.classList.add("show");}
}

loadMode();setState("idle");
setTimeout(function(){if(synth)synth.getVoices();},400);
checkBanner();
var h=new Date().getHours();
var g=h<12?"Good Morning":h<17?"Good Afternoon":"Good Evening";
bubble("a",g+"! I am your Revive Assistant &#8212; how can I help you today?");
</script>
